<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Total Fit - Mis entrenamientos</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Total Fit">
<meta name="theme-color" content="#0a0a0a">
<style>
:root{color-scheme:dark;--bg:#0a0a0a;--card:#161616;--txt:#f5f5f5;--mut:#9a9a9a;--ac:#D9B93C;--acTxt:#0a0a0a;--line:#2a2a2a}
*{box-sizing:border-box}
body{margin:0 auto;padding:16px;max-width:520px;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt)}
h1{font-size:1.3rem;margin:.2rem 0 1rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ac)}
h2{font-size:1rem;margin:0 0 10px;color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
button{font:inherit;background:var(--ac);color:var(--acTxt);font-weight:700;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
button:disabled{opacity:.5}
button.sec{background:transparent;color:var(--txt);border:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.tabs button{white-space:nowrap;background:transparent;color:var(--txt);border:1px solid var(--line)}
.tabs button.on{background:var(--ac);color:var(--acTxt)}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-child{border-top:0;padding-top:0}
.row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-bottom:8px}
.mut{color:var(--mut);font-size:.85rem;margin-top:4px}
.indic{color:var(--ac);font-size:.9rem;margin-top:6px}
.video{display:inline-block;color:var(--ac);font-size:.85rem;margin-top:4px}
.plan{white-space:pre-wrap;line-height:1.5;font-size:.95rem}
.planSel{background:var(--card);color:var(--txt);margin-bottom:10px}
details>summary{cursor:pointer;list-style:none;color:var(--ac)}
details>summary h2{display:inline;font-size:1rem;margin:0;color:var(--ac)}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:' ▾';color:var(--mut)}
details[open]>summary::after{content:' ▴'}
.hidden{display:none}
.err{color:#ff6b6b;min-height:1.2em}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.nav strong{text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;color:var(--mut);font-size:.75rem}
.dia{min-height:54px;border:1px solid var(--line);border-radius:8px;padding:4px;font-size:.8rem}
.dia.hoy{border-color:var(--ac)}
.num{color:var(--txt)}
.ok{color:var(--ac);font-weight:700}
.cmin{color:var(--mut);font-size:.72rem}
.logo{display:block;width:96px;height:96px;border-radius:50%;margin:0 auto 12px}
</style>
</head>
<body>

<div id="login">
  <img class="logo" src="logo.png" alt="Total Fit">
  <h1>Total Fit - Mis entrenamientos</h1>
  <div class="card">
    <input id="nombre" placeholder="Tu nombre" autocomplete="username">
    <br><br>
    <input id="pin" placeholder="PIN" type="password" inputmode="numeric" autocomplete="current-password">
    <br><br>
    <button id="entrar">Entrar</button>
    <p class="err" id="errLogin"></p>
  </div>
</div>

<div id="app" class="hidden">
  <img class="logo" src="logo.png" alt="Total Fit" style="width:64px;height:64px;margin-bottom:8px">
  <h1>Total Fit - Mis entrenamientos</h1>

  <details class="card" open>
    <summary><h2>Mi rutina</h2></summary>
    <div class="tabs" id="tabs" style="margin-top:10px"></div>
    <div class="row2" style="margin-top:10px"><input type="date" id="fechaRutina" title="Fecha de los pesos" max=""></div>
    <div id="dia"></div>
  </details>

  <details class="card">
    <summary><h2>Plan de alimentación</h2></summary>
    <div id="plan" style="margin-top:10px"></div>
  </details>

  <details class="card">
    <summary><h2>Cardio</h2></summary>
    <div id="cardio" style="margin-top:10px"></div>
  </details>

  <details class="card">
    <summary><h2>Calendario</h2></summary>
    <div id="calendario" style="margin-top:10px"></div>
  </details>

  <details class="card">
    <summary><h2>Evolución de cargas/fuerza</h2></summary>
    <div class="tabs" id="ejSel" style="margin-top:10px"></div>
    <div id="grafico"></div>
  </details>

  <details class="card">
    <summary><h2 style="display:inline">Cambiar mi PIN</h2></summary>
    <input id="pinActual" type="password" inputmode="numeric" maxlength="4" placeholder="PIN actual">
    <input id="pinNuevo" type="password" inputmode="numeric" maxlength="4" placeholder="PIN nuevo (4 números)">
    <input id="pinRepetir" type="password" inputmode="numeric" maxlength="4" placeholder="Repetí el PIN nuevo">
    <button id="cambiarPin">Cambiar PIN</button>
    <div class="mut" id="msgPin"></div>
  </details>

  <button class="sec" id="salir">Salir</button>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const sb = createClient(
  'https://oalwrseknjcbdxngzqgq.supabase.co',
  'sb_publishable_pw9lAS5n8Vyv0V9EOowoDA_zT2lH0Ns'
);

let alumno = null, pin = null, dias = [], diaIdx = 0, ejercicios = [], ejActivo = null;
let mesVista = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

const $ = id => document.getElementById(id);
const el = (tag, props = {}) => Object.assign(document.createElement(tag), props);
const hoyStr = () => new Date().toLocaleDateString('sv-SE');
const fechaStr = d => d.toLocaleDateString('sv-SE');

// ---------- LOGIN ----------
$('entrar').onclick = async () => {
  $('errLogin').textContent = '';
  const n = $('nombre').value.trim(), p = $('pin').value.trim();
  const { data, error } = await sb.rpc('login_alumno', { p_nombre: n, p_pin: p });
  if (error || !data) { $('errLogin').textContent = 'Nombre o PIN incorrecto'; return; }
  alumno = data; pin = p;
  sessionStorage.setItem('tf', JSON.stringify({ alumno, pin }));
  await cargar();
};

$('salir').onclick = () => { sessionStorage.removeItem('tf'); location.reload(); };

$('cambiarPin').onclick = async () => {
  const msg = $('msgPin');
  const actual = $('pinActual').value.trim(), nuevo = $('pinNuevo').value.trim(), rep = $('pinRepetir').value.trim();
  if (!/^[0-9]{4}$/.test(nuevo)) { msg.textContent = 'El PIN nuevo tiene que tener 4 números'; return; }
  if (nuevo !== rep) { msg.textContent = 'Los PIN nuevos no coinciden'; return; }
  if (actual !== pin) { msg.textContent = 'El PIN actual no es correcto'; return; }
  const { error } = await sb.rpc('alumno_cambiar_pin', { p_alumno: alumno, p_pin: pin, p_nuevo: nuevo });
  if (error) { msg.textContent = 'No se pudo cambiar, probá de nuevo'; return; }
  pin = nuevo;
  sessionStorage.setItem('tf', JSON.stringify({ alumno, pin }));
  $('pinActual').value = ''; $('pinNuevo').value = ''; $('pinRepetir').value = '';
  msg.textContent = 'PIN cambiado. Desde ahora usá el nuevo.';
};

// ---------- CARGA GENERAL ----------
async function cargar() {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');

  $('fechaRutina').value = hoyStr();
  $('fechaRutina').max = hoyStr();
  renderCardio();
  cargarCalendario();
  cargarPlan();

  const { data: rid, error } = await sb.rpc('alumno_rutina_vigente', { p_alumno: alumno, p_pin: pin });
  if (error) { $('dia').textContent = 'Error: ' + error.message; return; }
  if (!rid) { $('dia').textContent = 'Todavía no tenés una rutina asignada.'; return; }

  const { data: det, error: e2 } = await sb.rpc('rutina_detalle', { p_alumno: alumno, p_pin: pin, p_rutina: rid });
  if (e2) { $('dia').textContent = 'Error: ' + e2.message; return; }

  dias = det;
  const vistos = new Map();
  dias.forEach(d => d.ejercicios.forEach(e => vistos.set(e.id, e)));
  ejercicios = [...vistos.values()];

  renderTabsDias();
  mostrarDia(0);
  renderSelectorGrafico();
}

// ---------- RUTINA ----------
function renderTabsDias() {
  const t = $('tabs');
  t.replaceChildren();
  dias.forEach((d, i) => t.append(el('button', {
    textContent: `Día ${d.numero}${d.nombre ? ' · ' + d.nombre : ''}`,
    className: i === diaIdx ? 'on' : '',
    onclick: () => { diaIdx = i; renderTabsDias(); mostrarDia(i); }
  })));
}

function mostrarDia(i) {
  const cont = $('dia');
  cont.replaceChildren();
  const lista = dias[i]?.ejercicios || [];
  if (!lista.length) { cont.textContent = 'Este día todavía no tiene ejercicios.'; return; }
  lista.forEach(ex => cont.append(filaEjercicio(ex)));
}

// ---------- REGISTRO DE SERIE ----------
function filaEjercicio(ex) {
  const box = el('div', { className: 'ex' });
  box.append(el('strong', { textContent: ex.nombre }));
  box.append(el('div', { className: 'mut', textContent: `Objetivo: ${ex.series ?? '-'} series × ${ex.reps ?? '-'} reps` }));
  if (ex.video) box.append(el('a', { href: ex.video, target: '_blank', rel: 'noopener', textContent: 'Ver cómo se hace ▸', className: 'video' }));
  if (ex.indicaciones) box.append(el('div', { className: 'indic', textContent: `Indicación: ${ex.indicaciones}` }));

  const ultima = el('div', { className: 'mut' });
  box.append(ultima);
  mostrarUltima(ex.id, ultima);

  const row = el('div', { className: 'row' });
  const peso = el('input', { type: 'number', step: '0.5', placeholder: 'Peso kg', inputMode: 'decimal' });
  const reps = el('input', { type: 'number', placeholder: 'Reps', inputMode: 'numeric' });
  const btn = el('button', { textContent: 'Guardar' });
  const msg = el('div', { className: 'mut' });

  btn.onclick = async () => {
    if (!peso.value || !reps.value) { msg.textContent = 'Cargá peso y reps'; return; }
    btn.disabled = true;
    const { error } = await sb.rpc('registrar_serie_con_fecha', {
      p_alumno: alumno, p_pin: pin, p_ejercicio: ex.id,
      p_peso: Number(peso.value), p_repeticiones: Number(reps.value),
      p_fecha: $('fechaRutina').value || hoyStr()
    });
    btn.disabled = false;
    if (error) { msg.textContent = 'No se pudo guardar, probá de nuevo'; return; }
    msg.textContent = `Guardado: ${peso.value} kg × ${reps.value}`;
    ultima.textContent = `Última vez: ${peso.value} kg × ${reps.value}`;
    peso.value = ''; reps.value = '';
    cargarCalendario();
    if (ejActivo === ex.id) verGrafico(ex.id);
  };

  row.append(peso, reps, btn);
  box.append(row, msg);
  return box;
}

async function mostrarUltima(id, nodo) {
  const { data } = await sb.rpc('historial_ejercicio', { p_alumno: alumno, p_pin: pin, p_ejercicio: id });
  if (data?.length) {
    const u = data[data.length - 1];
    nodo.textContent = `Última vez: ${u.peso} kg × ${u.repeticiones} (${u.fecha})`;
  } else {
    nodo.textContent = 'Primera vez con este ejercicio';
  }
}

// ---------- CARDIO ----------
async function renderCardio() {
  const c = $('cardio');
  c.replaceChildren();

  const { data: obj } = await sb.rpc('alumno_cardio_objetivo', { p_alumno: alumno, p_pin: pin });
  const o = obj?.[0];
  if (o && (o.dias || o.minutos)) {
    c.append(el('div', { className: 'mut', textContent: `Objetivo: ${o.dias ?? '-'} días por semana · ${o.minutos ?? '-'} min aprox.` }));
  }

  const fecha = el('input', { type: 'date', value: hoyStr(), max: hoyStr(), title: 'Fecha' });
  const min = el('input', { type: 'number', placeholder: 'Minutos', inputMode: 'numeric' });
  const nota = el('input', { placeholder: 'Nota (opcional)' });
  const btn = el('button', { textContent: 'Guardar cardio' });
  const msg = el('div', { className: 'mut' });

  const fila = el('div', { className: 'row2' });
  fila.style.gridTemplateColumns = '1fr 1fr';
  fecha.style.minWidth = '0';
  fecha.style.width = '100%';
  min.style.minWidth = '0';
  min.style.width = '100%';
  fila.append(fecha, min);

  btn.onclick = async () => {
    if (!min.value) { msg.textContent = 'Poné los minutos'; return; }
    btn.disabled = true;
    const { error } = await sb.rpc('registrar_cardio', {
      p_alumno: alumno, p_pin: pin, p_fecha: fecha.value || hoyStr(),
      p_minutos: Number(min.value), p_nota: nota.value.trim() || null
    });
    btn.disabled = false;
    msg.textContent = error ? 'No se pudo guardar' : `Guardado: ${min.value} min el ${fecha.value || hoyStr()}`;
    if (!error) { min.value = ''; nota.value = ''; cargarCalendario(); }
  };

  c.append(fila, nota, btn, msg);
}

// ---------- CALENDARIO ----------
async function cargarCalendario() {
  const cont = $('calendario');
  const ini = new Date(mesVista.getFullYear(), mesVista.getMonth(), 1);
  const fin = new Date(mesVista.getFullYear(), mesVista.getMonth() + 1, 0);

  const { data, error } = await sb.rpc('calendario', {
    p_alumno: alumno, p_pin: pin, p_desde: fechaStr(ini), p_hasta: fechaStr(fin)
  });

  cont.replaceChildren();

  const nav = el('div', { className: 'nav' });
  nav.append(
    el('button', { className: 'sec', textContent: '←', onclick: () => {
      mesVista = new Date(mesVista.getFullYear(), mesVista.getMonth() - 1, 1); cargarCalendario();
    }}),
    el('strong', { textContent: mesVista.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' }) }),
    el('button', { className: 'sec', textContent: '→', onclick: () => {
      mesVista = new Date(mesVista.getFullYear(), mesVista.getMonth() + 1, 1); cargarCalendario();
    }})
  );
  cont.append(nav);

  if (error) { cont.append(el('div', { className: 'mut', textContent: 'No se pudo cargar el calendario' })); return; }

  const entrenos = new Set((data.entrenos || []).map(e => e.fecha));
  const cardio = new Map((data.cardio || []).map(c => [c.fecha, c]));

  const grid = el('div', { className: 'grid' });
  ['L', 'M', 'X', 'J', 'V', 'S', 'D'].forEach(d => grid.append(el('div', { className: 'dow', textContent: d })));

  const offset = (ini.getDay() + 6) % 7;
  for (let i = 0; i < offset; i++) grid.append(el('div'));

  for (let d = 1; d <= fin.getDate(); d++) {
    const f = fechaStr(new Date(ini.getFullYear(), ini.getMonth(), d));
    const celda = el('div', { className: 'dia' + (f === hoyStr() ? ' hoy' : '') });
    celda.append(el('div', { className: 'num', textContent: String(d) }));
    if (entrenos.has(f)) celda.append(el('div', { className: 'ok', textContent: '✔' }));
    const c = cardio.get(f);
    if (c) celda.append(el('div', { className: 'cmin', textContent: `${c.minutos} min` }));
    grid.append(celda);
  }
  cont.append(grid);
}

// ---------- GRÁFICO DE EVOLUCIÓN ----------
function renderSelectorGrafico() {
  const s = $('ejSel');
  s.replaceChildren();
  ejercicios.forEach(e => s.append(el('button', {
    textContent: e.nombre,
    className: e.id === ejActivo ? 'on' : '',
    onclick: () => { verGrafico(e.id); renderSelectorGrafico(); }
  })));
  if (!ejActivo && ejercicios.length) verGrafico(ejercicios[0].id);
}

async function verGrafico(id) {
  ejActivo = id;
  const g = $('grafico');
  const { data, error } = await sb.rpc('historial_ejercicio', { p_alumno: alumno, p_pin: pin, p_ejercicio: id });
  if (error) { g.textContent = 'No se pudo cargar el gráfico'; return; }
  if (!data?.length) { g.textContent = 'Todavía no hay registros de este ejercicio.'; return; }

  const W = 480, H = 180, P = 28;
  const pesos = data.map(d => Number(d.peso));
  const min = Math.min(...pesos), max = Math.max(...pesos);
  const rango = max - min || 1;
  const x = i => data.length === 1 ? W / 2 : P + i * (W - 2 * P) / (data.length - 1);
  const y = v => H - P - (Number(v) - min) / rango * (H - 2 * P);

  const pts = pesos.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const puntos = pesos.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="var(--ac)"/>`).join('');
  const ultimo = data[data.length - 1];

  g.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" width="100%">
      <polyline fill="none" stroke="var(--ac)" stroke-width="3" points="${pts}"/>
      ${puntos}
    </svg>
    <div class="mut">Máximo: ${max} kg · Último: ${ultimo.peso} kg × ${ultimo.repeticiones} (${ultimo.fecha})</div>`;
}

// ---------- PLAN DE ALIMENTACIÓN ----------
async function cargarPlan() {
  const cont = $('plan');
  cont.replaceChildren();
  const { data, error } = await sb.rpc('alumno_planes', { p_alumno: alumno, p_pin: pin });
  if (error) { cont.textContent = 'No se pudo cargar el plan'; return; }
  if (!data?.length) { cont.textContent = 'Todavía no tenés un plan de alimentación.'; return; }

  const nombreMes = f => new Date(f + 'T12:00:00').toLocaleDateString('es-AR', { month: 'long', year: 'numeric' });
  const sel = el('select', { className: 'planSel' });
  data.forEach((p, i) => sel.append(el('option', { value: i, textContent: nombreMes(p.mes) })));
  const txt = el('div', { className: 'plan' });
  const mostrar = i => { txt.textContent = data[i].texto; };
  sel.onchange = () => mostrar(sel.value);
  mostrar(0);
  cont.append(sel, txt);
}

// ---------- SESIÓN GUARDADA ----------
const s = JSON.parse(sessionStorage.getItem('tf') || 'null');
if (s) { alumno = s.alumno; pin = s.pin; await cargar(); }
</script>
</body>
</html>
